<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulley Detection - Live Camera</title>

    <style>
        /* ================= YOUR ORIGINAL CSS (UNCHANGED) ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1724;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }

        .container { display: flex; height: 100vh; }

        .camera-section {
            flex: 1;
            background: #1a1f2e;
            display: flex;
            flex-direction: column;
            border-right: 2px solid rgba(255,255,255,0.1);
        }

        .camera-header {
            padding: 16px 20px;
            background: linear-gradient(180deg,#0b1320,#0b1624);
        }

        .camera-header h2 { color: #0b74de; }

        .video-container {
            flex: 1;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }

        .video-placeholder {
            position: absolute;
            color: #64748b;
        }

        .results-section {
            flex: 1;
            background: #1a1f2e;
            overflow-y: auto;
        }

        .results-header {
            padding: 16px 20px;
            background: linear-gradient(180deg,#0b1320,#0b1624);
        }

        .results-header h2 { color: #0b74de; }

        .results-content { padding: 24px; }

        .status-card {
            background: rgba(11,116,222,0.1);
            border: 1px solid rgba(11,116,222,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .active { background: #10b981; }
        .inactive { background: #ef4444; }

        .metric-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .metric-label { font-size: 12px; color: #94a3b8; }
        .metric-value { font-size: 26px; color: #0b74de; }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ================= LEFT: CAMERA ================= -->
    <div class="camera-section">
        <div class="camera-header">
            <h2>📹 Live Camera Feed</h2>
        </div>

        <div class="video-container">
            <!-- ❌ SERVER CAMERA REMOVED -->
            <!-- ✅ BROWSER CAMERA -->
            <video id="videoStream" autoplay playsinline></video>
            <canvas id="hiddenCanvas" style="display:none;"></canvas>

            <div class="video-placeholder" id="videoPlaceholder">
                Waiting for camera permission...
            </div>
        </div>
    </div>

    <!-- ================= RIGHT: RESULTS (YOUR CODE) ================= -->
    <div class="results-section">
        <div class="results-header">
            <h2>📊 Detection Results</h2>
        </div>

        <div class="results-content">

            <div class="status-card">
                <h3>
                    <span class="status-indicator inactive" id="statusIndicator"></span>
                    System Status
                </h3>
                <div id="statusText">Initializing...</div>
            </div>

            <div class="metric-card">
                <div class="metric-label">Pulleys Detected</div>
                <div class="metric-value" id="pulleyCount">0</div>
            </div>

        </div>
    </div>

</div>

<!-- ================= CAMERA + FRAME SEND SCRIPT ================= -->
<script>
/* ================== BROWSER CAMERA CODE (ADDED) ================== */

const video = document.getElementById("videoStream");
const canvas = document.getElementById("hiddenCanvas");
const ctx = canvas.getContext("2d");
const placeholder = document.getElementById("videoPlaceholder");
const statusText = document.getElementById("statusText");
const statusIndicator = document.getElementById("statusIndicator");

/* 1️⃣ OPEN CAMERA */
navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
        video.srcObject = stream;
        placeholder.style.display = "none";
        statusText.innerText = "Camera active";
        statusIndicator.className = "status-indicator active";
    })
    .catch(err => {
        placeholder.innerText = "Camera permission denied";
        statusText.innerText = "Camera error";
        console.error(err);
    });

/* 2️⃣ SEND FRAME TO DJANGO */
setInterval(() => {
    if (video.videoWidth === 0) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append("frame", blob);

        fetch("{% url 'process_frame' %}", {
            method: "POST",
            body: formData
        }).catch(err => console.error(err));

    }, "image/jpeg", 0.8);
}, 300);

/* ================== YOUR EXISTING POLLING LOGIC ================== */
function updateResults() {
    fetch('{% url "detection_results" %}')
        .then(res => res.json())
        .then(data => {
            document.getElementById("pulleyCount").innerText = data.pulley_count || 0;
        })
        .catch(err => console.error(err));
}

setInterval(updateResults, 500);
updateResults();
</script>

</body>
</html>
